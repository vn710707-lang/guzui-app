<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>古錐星命閣</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0820;color:#fff;font-family:'Microsoft JhengHei',sans-serif;min-height:100vh;overflow-x:hidden;}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite;}
@keyframes twinkle{0%,100%{opacity:0.2;}50%{opacity:1;}}
.top-bar{position:relative;z-index:10;background:linear-gradient(180deg,rgba(13,8,32,0.95),rgba(13,8,32,0.7));padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(212,175,55,0.3);}
.char-info{display:flex;align-items:center;gap:8px;}
.char-avatar{width:44px;height:44px;border-radius:50%;border:2px solid #d4af37;overflow:hidden;background:#1a0d3a;}
.char-avatar img{width:100%;height:100%;object-fit:cover;object-position:top;}
.char-details h3{font-size:13px;color:#d4af37;margin-bottom:2px;}
.char-details .lv{font-size:11px;color:#9b8bbf;}
.lv-bar{width:80px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin-top:3px;}
.lv-fill{width:75%;height:100%;background:linear-gradient(90deg,#d4af37,#ffd700);border-radius:2px;}
.top-stats{display:flex;gap:8px;}
.stat{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,0.4);border:1px solid rgba(212,175,55,0.3);border-radius:20px;padding:4px 8px;}
.stat span{font-size:12px;color:#ffd700;}
.hero-section{position:relative;z-index:5;width:100%;height:280px;overflow:hidden;}
.hero-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#0d0820 0%,#1a0d3a 40%,#0d1a3a 100%);}
.character-img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:260px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(212,175,55,0.4));animation:float 4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-10px);}}
.hero-title{position:absolute;top:15px;left:0;right:0;text-align:center;}
.hero-title h1{font-size:20px;color:#d4af37;letter-spacing:3px;text-shadow:0 0 20px rgba(212,175,55,0.8);}
.hero-title p{font-size:11px;color:#9b8bbf;margin-top:3px;}
.sparkle{position:absolute;color:#d4af37;font-size:12px;animation:sparkleAnim 3s infinite;}
@keyframes sparkleAnim{0%,100%{opacity:0;transform:scale(0);}50%{opacity:1;transform:scale(1);}}
.menu-section{position:relative;z-index:10;padding:10px 12px;}
.menu-title{text-align:center;font-size:12px;color:#9b8bbf;letter-spacing:2px;margin-bottom:8px;}
.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.menu-card{background:linear-gradient(135deg,rgba(26,13,58,0.95),rgba(13,8,32,0.98));border:1px solid rgba(212,175,55,0.25);border-radius:12px;padding:12px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;}
.menu-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(212,175,55,0.5),transparent);}
.menu-card:active{transform:scale(0.97);border-color:rgba(212,175,55,0.6);}
.menu-card .m-icon{font-size:26px;margin-bottom:6px;}
.menu-card h3{font-size:13px;color:#d4af37;margin-bottom:2px;}
.menu-card p{font-size:10px;color:#7a6a9a;}
.menu-card.hot::after{content:'熱門';position:absolute;top:6px;right:6px;background:linear-gradient(135deg,#ff4444,#ff8800);border-radius:8px;padding:1px 6px;font-size:9px;color:#fff;}
.zodiac-section{position:relative;z-index:10;padding:8px 12px;}
.section-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.section-hd::before,.section-hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,0.4),transparent);}
.section-hd span{font-size:12px;color:#d4af37;white-space:nowrap;letter-spacing:1px;}
.zodiac-scroll{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.z-item{background:rgba(26,13,58,0.8);border:1px solid rgba(212,175,55,0.15);border-radius:10px;padding:7px 4px;text-align:center;cursor:pointer;transition:all 0.2s;}
.z-item:active,.z-item.sel{background:rgba(212,175,55,0.15);border-color:rgba(212,175,55,0.5);}
.z-item .zs{font-size:18px;}
.z-item .zn{font-size:10px;color:#d4af37;margin-top:2px;}
.z-item .zd{font-size:8px;color:#6a5a8a;margin-top:1px;}
.page{display:none;padding-bottom:65px;}
.page.active{display:block;}
.page-header{position:relative;z-index:10;background:linear-gradient(180deg,#0d0820,#1a0d3a);padding:12px 15px;border-bottom:1px solid rgba(212,175,55,0.2);display:flex;align-items:center;gap:10px;}
.back-btn{width:32px;height:32px;background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;}
.page-header h2{font-size:16px;color:#d4af37;}
.page-header-char{width:36px;height:36px;border-radius:50%;border:1px solid #d4af37;overflow:hidden;margin-left:auto;}
.page-header-char img{width:100%;height:100%;object-fit:cover;object-position:top;}
.zodiac-mini{display:flex;overflow-x:auto;gap:8px;padding:10px 12px;scrollbar-width:none;}
.zodiac-mini::-webkit-scrollbar{display:none;}
.zm-item{flex-shrink:0;background:rgba(26,13,58,0.8);border:1px solid rgba(212,175,55,0.2);border-radius:20px;padding:5px 12px;cursor:pointer;white-space:nowrap;transition:all 0.2s;}
.zm-item.sel{background:rgba(212,175,55,0.2);border-color:#d4af37;}
.zm-item span{font-size:12px;color:#d4af37;}
.quick-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px;}
.q-btn{background:rgba(26,13,58,0.8);border:1px solid rgba(212,175,55,0.25);border-radius:15px;padding:5px 11px;font-size:11px;color:#c4a040;cursor:pointer;white-space:nowrap;}
.q-btn:active{background:rgba(212,175,55,0.15);}
.chat-wrap{padding:0 12px;}
.chat-box{background:rgba(10,5,25,0.9);border:1px solid rgba(212,175,55,0.2);border-radius:12px;padding:12px;min-height:200px;max-height:350px;overflow-y:auto;margin-bottom:10px;}
.chat-box::-webkit-scrollbar{width:3px;}
.chat-box::-webkit-scrollbar-thumb{background:rgba(212,175,55,0.3);border-radius:2px;}
.msg{margin-bottom:12px;animation:msgIn 0.3s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg.ai{display:flex;gap:8px;}
.msg.ai .av{width:30px;height:30px;border-radius:50%;border:1px solid #d4af37;overflow:hidden;flex-shrink:0;}
.msg.ai .av img{width:100%;height:100%;object-fit:cover;object-position:top;}
.msg.ai .bbl{background:rgba(26,13,58,0.9);border:1px solid rgba(212,175,55,0.2);border-radius:0 10px 10px 10px;padding:9px 11px;font-size:13px;line-height:1.6;color:#ddd;max-width:83%;}
.msg.user{display:flex;justify-content:flex-end;}
.msg.user .bbl{background:rgba(212,175,55,0.15);border:1px solid rgba(212,175,55,0.35);border-radius:10px 0 10px 10px;padding:9px 11px;font-size:13px;color:#fff;max-width:83%;}
.typing-dots{display:flex;gap:4px;padding:4px 0;}
.typing-dots span{width:6px;height:6px;background:#9b8bbf;border-radius:50%;animation:dot 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes dot{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-6px);}}
.input-row{display:flex;gap:8px;padding:0 12px;}
.input-row input{flex:1;background:rgba(26,13,58,0.8);border:1px solid rgba(212,175,55,0.3);border-radius:22px;padding:10px 15px;color:#fff;font-size:13px;outline:none;}
.input-row input::placeholder{color:#5a4a7a;}
.input-row input:focus{border-color:rgba(212,175,55,0.6);}
.send-btn{width:42px;height:42px;background:linear-gradient(135deg,#c4a040,#8a6d2a);border:none;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.send-btn:active{transform:scale(0.92);}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,5,25,0.97);border-top:1px solid rgba(212,175,55,0.25);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;padding:8px 4px;text-align:center;cursor:pointer;}
.nav-btn .ni{font-size:20px;margin-bottom:2px;}
.nav-btn .nl{font-size:9px;color:#6a5a8a;}
.nav-btn.on .nl{color:#d4af37;}
</style>
</head>

<script>
const KEY='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';
const ZS=[
  {n:'牡羊',s:'♈',d:'3/21-4/19'},{n:'金牛',s:'♉',d:'4/20-5/20'},
  {n:'雙子',s:'♊',d:'5/21-6/20'},{n:'巨蟹',s:'♋',d:'6/21-7/22'},
  {n:'獅子',s:'♌',d:'7/23-8/22'},{n:'處女',s:'♍',d:'8/23-9/22'},
  {n:'天秤',s:'♎',d:'9/23-10/22'},{n:'天蠍',s:'♏',d:'10/23-11/21'},
  {n:'射手',s:'♐',d:'11/22-12/21'},{n:'摩羯',s:'♑',d:'12/22-1/19'},
  {n:'水瓶',s:'♒',d:'1/20-2/18'},{n:'雙魚',s:'♓',d:'2/19-3/20'}
];
const SP=`妳是「古錐星命閣」的神秘命理師「九天玄女」，精通西洋占星、塔羅牌、中國八字命理、紫微斗數。

【重要規則】
一、全程只能輸出繁體中文。
二、自稱「九天玄女」，稱用戶為「親愛的有緣人」。
三、說話風格親切溫暖，像朋友一樣關心用戶，但帶有神秘感。多用「哦」「呢」「喔」「嗯」等親切語氣詞。
四、適時加入✨🌙🔮⭐💫🌟符號。
五、開頭引用一句神秘天象詩句，結尾給予溫暖祝福。
六、若用戶選擇了特定星座，只針對該星座詳細解析，不要同時說12個星座。
七、現在是2026年丙午年。`;

let selZ='';
let hist={zodiac:[],tarot:[],bazi:[],ziwei:[]};

function createStars(){
  const c=document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.cssText=`width:${Math.random()*2+1}px;height:${Math.random()*2+1}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${Math.random()*3+2}s;`;
    c.appendChild(s);
  }
}

function renderZS(){
  const hz=document.getElementById('home-zodiac');
  const mz=document.getElementById('zodiac-mini');
  if(hz) hz.innerHTML=ZS.map(z=>`<div class="z-item ${selZ===z.n+'座'?'sel':''}" onclick="pickZ('${z.n}座')"><div class="zs">${z.s}</div><div class="zn">${z.n}</div><div class="zd">${z.d}</div></div>`).join('');
  if(mz) mz.innerHTML=ZS.map(z=>`<div class="zm-item ${selZ===z.n+'座'?'sel':''}" onclick="pickZ('${z.n}座')"><span>${z.s} ${z.n}座</span></div>`).join('');
}

function pickZ(name){
  selZ=name;
  renderZS();
  openPage('pg-zodiac');
  setTimeout(()=>qSend('zodiac',name+'今日完整運勢分析'),300);
}

function openPage(id,navEl){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(n=>n.classList.remove('on'));
  if(navEl) navEl.classList.add('on');
  window.scrollTo(0,0);
}

function addMsg(cid,role,txt){
  const box=document.getElementById(cid+'-chat');
  if(!box) return;
  const d=document.createElement('div');
  d.className='msg '+(role==='ai'?'ai':'user');
  if(role==='ai') d.innerHTML=`<div class="av"><img src="character.png"></div><div class="bbl">${txt}</div>`;
  else d.innerHTML=`<div class="bbl">${txt}</div>`;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
}

function showTyping(cid){
  const box=document.getElementById(cid+'-chat');
  if(!box) return;
  const d=document.createElement('div');
  d.className='msg ai';d.id=cid+'-typing';
  d.innerHTML=`<div class="av"><img src="character.png"></div><div class="bbl"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
}

function rmTyping(cid){const t=document.getElementById(cid+'-typing');if(t)t.remove();}

async function callAI(msg,history){
  const messages=[{role:'system',content:SP},...history.slice(-6),{role:'user',content:msg}];
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
